{% extends "base.html" %}

{% block title %}My Profile - NeuroHealth{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-user me-2 text-primary"></i>My Profile</h2>
    <a href="{{ url_for('patient_dashboard') }}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
    </a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-user-edit me-2"></i>Personal Information</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>
                    <strong>Demo Mode:</strong> Profile editing is not available in demo mode.
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" value="{{ user.first_name }}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" value="{{ user.last_name }}" readonly>
                    </div>
                </div>
                
                <div class="row mt-3">
                    <div class="col-md-12">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" value="{{ user.email }}" readonly>
                    </div>
                </div>
                
                <div class="row mt-3">
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" value="{{ user.phone }}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <input type="text" class="form-control" value="{{ user.gender or 'Not specified' }}" readonly>
                    </div>
                </div>
                
                <div class="row mt-3">
                    <div class="col-md-6">
                        <label class="form-label">Date of Birth</label>
                        <input type="text" class="form-control" value="{{ user.date_of_birth or 'Not specified' }}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Account Type</label>
                        <input type="text" class="form-control" value="{{ user.user_type|title }}" readonly>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-shield-alt me-2"></i>Account Security</h5>
            </div>
            <div class="card-body">
                <p><i class="fas fa-check-circle text-success me-2"></i>Account Active</p>
                <p><i class="fas fa-lock text-success me-2"></i>Password Protected</p>
                <p><i class="fas fa-user-shield text-success me-2"></i>HIPAA Compliant</p>
                
                <button class="btn btn-outline-primary btn-sm" disabled>
                    <i class="fas fa-key me-1"></i>Change Password
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
